name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'ZF*.png']   # правка README не гоняет сборку
  pull_request:
    branches: [master]

# при частых пушах отменяем предыдущий незавершённый прогон,
# чтобы не копить очередь и не жечь минуты
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Установка зависимостей (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 xvfb

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      - name: Тесты (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet test --no-build --configuration Release

      - name: Сохранить неудачные снимки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: '**/Snapshots/Failed/*.png'
          if-no-files-found: ignore

      - name: Тесты (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          ZF_CREATE_SNAPSHOTS: 'true'
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" dotnet test --no-build --configuration Release

      - name: Выгрузить снимки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: |
            tests/ZeppelinForms.UnitTests/Snapshots/Expected/**
            tests/ZeppelinForms.UnitTests/Snapshots/Failed/**
          if-no-files-found: warn
