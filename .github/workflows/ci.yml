name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'ZF*.png']   # правка README не гоняет сборку
  pull_request:
    branches: [master]

# при частых пушах отменяем предыдущий незавершённый прогон,
# чтобы не копить очередь и не жечь минуты
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Установка зависимостей (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 xvfb

      - name: Установка workloads
        # the workloads of the installed SDK, not the newest workload set: a set can
        # be published before all of its manifests are (10.0.402.1 named an iOS manifest
        # nuget.org didn't have yet), and the install failed on both runners
        run: dotnet workload install wasm-tools android --skip-manifest-update

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      # the Visual Studio extension is not in the solution: it builds with Visual
      # Studio's MSBuild only. Built here so that a change to the framework that
      # breaks the previewer shows up before a release tag does
      - uses: microsoft/setup-msbuild@v2
        if: matrix.os == 'windows-latest'

      - name: Расширение Visual Studio
        if: matrix.os == 'windows-latest'
        run: msbuild tools/ZeppelinForms.VisualStudio/ZeppelinForms.VisualStudio.sln /restore /p:Configuration=Release /p:DeployExtension=false /v:minimal /bl:vsix.binlog

      - name: Выгрузить расширение
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: tools/ZeppelinForms.VisualStudio/bin/**/*.vsix
          if-no-files-found: error

      # the build log of the extension, for when there is no .vsix: which targets
      # ran and which were skipped, and why. Opens in the MSBuild Structured Log Viewer
      - name: Выгрузить журнал сборки расширения
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: vsix-binlog
          path: vsix.binlog
          if-no-files-found: ignore

      - name: Тесты (Windows)
        # a hung test ends the step rather than holding the runner for six hours
        timeout-minutes: 30
        if: matrix.os == 'windows-latest'
        run: dotnet test --no-build --configuration Release -- --output Detailed

      - name: Тесты (Linux)
        # a hung test ends the step rather than holding the runner for six hours
        timeout-minutes: 30
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" dotnet test --no-build --configuration Release -- --output Detailed

      - name: Выгрузить неудачные снимки
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: snapshots-${{ matrix.os }}
          path: tests/ZeppelinForms.UnitTests/Snapshots/Failed/**
          if-no-files-found: ignore

      - name: Выгрузить результаты тестов
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: ignore

  # The VS Code extension and the Rider plugin: built outside the solution, each with its own
  # tools, on Linux. Both speak the designer protocol in their own language, so their tests
  # read bytes .NET wrote, and the Rider plugin's also hold a conversation with a real host
  # about the examples' library
  editors:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/ZeppelinForms.VSCode/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Skia's text needs fontconfig, as the tests of the framework do
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Расширение VS Code
        working-directory: tools/ZeppelinForms.VSCode
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npx vsce package --out zeppelinforms.vsix

      - name: Выгрузить расширение VS Code
        uses: actions/upload-artifact@v6
        with:
          name: vscode
          path: tools/ZeppelinForms.VSCode/zeppelinforms.vsix
          if-no-files-found: error

      - name: Библиотека примеров для теста превью
        run: dotnet build "examples/ZF SharedLib/ZF SharedLib.csproj" --configuration Release

      # bash: the executable bit of gradlew doesn't survive every checkout
      - name: Плагин Rider
        working-directory: tools/ZeppelinForms.Rider
        env:
          ZF_DESIGNER_HOST: ${{ github.workspace }}/tools/ZeppelinForms.Rider/build/dotnet/designer/ZeppelinForms.Designer.dll
          ZF_PREVIEW_ASSEMBLY: ${{ github.workspace }}/examples/ZF SharedLib/bin/Release/net10.0/ZF SharedLib.dll
        run: bash gradlew publishDesigner test buildPlugin --stacktrace

      - name: Выгрузить плагин Rider
        uses: actions/upload-artifact@v6
        with:
          name: rider
          path: tools/ZeppelinForms.Rider/build/distributions/*.zip
          if-no-files-found: error
