name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release and its files
  packages: write   # NuGet packages in GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Установка workload
        run: dotnet workload install wasm-tools android

      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1 xvfb

      # the same way as CI: the X11 tests need a display
      - run: xvfb-run -a --server-args="-screen 0 1024x768x24" dotnet test --configuration Release

      - name: Версия из тега
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          # v0.13.0-preview.1 is a prerelease of 0.13.0: its notes are 0.13.0's
          echo "base=${VERSION%%-*}" >> $GITHUB_OUTPUT

      - name: Извлечь описание версии
        run: |
          VERSION="${{ steps.version.outputs.base }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # ссылка на полный список изменений внизу описания
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "[Полный список изменений](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)" >> release-notes.md

          cat release-notes.md

      # the packages one by one: the solution also holds tests, examples and
      # benchmarks, which are not packages. The version comes from the tag
      - name: NuGet-пакеты
        run: |
          for project in \
            src/ZeppelinForms/ZeppelinForms.csproj \
            src/ZeppelinForms.Skia/ZeppelinForms.Skia.csproj \
            src/ZeppelinForms.Windows/ZeppelinForms.Windows.csproj \
            src/ZeppelinForms.Linux/ZeppelinForms.Linux.csproj \
            src/ZeppelinForms.Android/ZeppelinForms.Android.csproj \
            src/ZeppelinForms.Browser/ZeppelinForms.Browser.csproj
          do
            dotnet pack "$project" --configuration Release --output packages \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:ContinuousIntegrationBuild=true
          done

          ls -l packages

      # GitHub Packages takes no symbol packages: --no-symbols, the .snupkg go
      # to the release instead. --skip-duplicate makes a rerun of the job harmless
      - name: Публикация в GitHub Packages
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --no-symbols \
            --skip-duplicate

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            packages/*.nupkg
            packages/*.snupkg
            src/ZeppelinForms.Browser/zf.js
  
  # The Visual Studio extension — the previewer — builds with Visual Studio's MSBuild
  # only, so on Windows, after the packages: it is attached to the release they made
  vsix:
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # the extension's build publishes the previewer's host, a .NET 10 program
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      # the version follows the tag, as the packages' does. A VSIX version has no
      # prerelease part: v0.14.0-preview.1 gives 0.14.0
      - name: Версия расширения из тега
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v').Split('-')[0]
          $manifest = 'tools/ZeppelinForms.VisualStudio/source.extension.vsixmanifest'
          $text = Get-Content $manifest -Raw
          $text = $text -replace '(<Identity [^>]*Version=")[^"]*(")', "`${1}$version`${2}"
          Set-Content $manifest $text -NoNewline
          Select-String -Path $manifest -Pattern '<Identity '

      # DeployExtension=false: the build would install the extension into an
      # experimental instance of Visual Studio, which a build machine has no use for
      - name: Сборка расширения
        run: msbuild tools/ZeppelinForms.VisualStudio/ZeppelinForms.VisualStudio.sln /restore /p:Configuration=Release /p:DeployExtension=false /v:minimal

      - name: Расширение в релиз
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: tools/ZeppelinForms.VisualStudio/bin/Release/**/*.vsix