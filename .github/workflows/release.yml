name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release and its files
  packages: write   # NuGet packages in GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Установка workload
        # the workloads of the installed SDK, not the newest workload set: a set can
        # be published before all of its manifests are (10.0.402.1 named an iOS manifest
        # nuget.org didn't have yet), and the install failed on both runners
        run: dotnet workload install wasm-tools android --skip-manifest-update

      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1 xvfb

      # the same way as CI: the X11 tests need a display
      - run: xvfb-run -a --server-args="-screen 0 1024x768x24" dotnet test --configuration Release

      - name: Версия из тега
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          # v0.13.0-preview.1 is a prerelease of 0.13.0: its notes are 0.13.0's
          echo "base=${VERSION%%-*}" >> $GITHUB_OUTPUT

      - name: Извлечь описание версии
        run: |
          VERSION="${{ steps.version.outputs.base }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          
          # no section for the version: the tag is on a commit without it — 0.17.0 was
          # tagged on a master that didn't have the release merged yet, and shipped
          # the code of 0.16.3 with empty notes. Better no release than a wrong one
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md at ${GITHUB_SHA} has no section for $VERSION: is the tag on the right commit?"
            exit 1
          fi

          # ссылка на полный список изменений внизу описания
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "[Полный список изменений](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)" >> release-notes.md

          cat release-notes.md

      # the packages one by one: the solution also holds tests, examples and
      # benchmarks, which are not packages. The version comes from the tag
      - name: NuGet-пакеты
        run: |
          for project in \
            src/ZeppelinForms/ZeppelinForms.csproj \
            src/ZeppelinForms.Skia/ZeppelinForms.Skia.csproj \
            src/ZeppelinForms.Windows/ZeppelinForms.Windows.csproj \
            src/ZeppelinForms.Linux/ZeppelinForms.Linux.csproj \
            src/ZeppelinForms.Android/ZeppelinForms.Android.csproj \
            src/ZeppelinForms.Browser/ZeppelinForms.Browser.csproj \
            templates/ZeppelinForms.Templates/ZeppelinForms.Templates.csproj
          do
            dotnet pack "$project" --configuration Release --output packages \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:ContinuousIntegrationBuild=true
          done

          ls -l packages

      # GitHub Packages takes no symbol packages: --no-symbols, the .snupkg go
      # to the release instead. --skip-duplicate makes a rerun of the job harmless
      - name: Публикация в GitHub Packages
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --no-symbols \
            --skip-duplicate

      # the same packages for the nuget.org job: it is separate, so that a missing
      # or broken nuget.org setup doesn't hold back the GitHub release and the extension
      - name: Пакеты для nuget.org
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: packages/*
          if-no-files-found: error

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            packages/*.nupkg
            packages/*.snupkg
            src/ZeppelinForms.Browser/zf.js
  
  # nuget.org by trusted publishing: no key is stored anywhere. A policy on nuget.org
  # (Trusted Publishing: owner YD359Team, repository ZeppelinForms-solution, workflow
  # release.yml) lets NuGet/login trade this job's OIDC token for an API key that lives
  # an hour; the only secret is NUGET_USER, the nuget.org profile name. The .snupkg
  # next to each .nupkg goes along: nuget.org keeps symbols, unlike GitHub Packages.
  # Version 0.13 was uploaded by hand
  nuget-org:
    needs: publish
    runs-on: ubuntu-latest
    environment: nuget-org

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Вход на nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate makes a rerun of the job harmless
      - name: Публикация на nuget.org
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

  # The Visual Studio extension — the previewer — builds with Visual Studio's MSBuild
  # only, so on Windows, after the packages: it is attached to the release they made
  vsix:
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # the extension's build publishes the previewer's host, a .NET 10 program
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      # the version follows the tag, as the packages' does. The build takes it as
      # /p:Version and the manifest reads it from the project (GetVsixVersion), which
      # drops the prerelease part a VSIX version can't have: v0.14.0-preview.1 gives 0.14.0
      - name: Версия расширения из тега
        id: vsixversion
        shell: pwsh
        run: |
          # the host inside the extension gets the full version, as the packages do:
          # a host of another version can't bind a project built against them
          "full=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      # DeployExtension=false: the build would install the extension into an
      # experimental instance of Visual Studio, which a build machine has no use for
      - name: Сборка расширения
        run: msbuild tools/ZeppelinForms.VisualStudio/ZeppelinForms.VisualStudio.sln /restore /p:Configuration=Release /p:DeployExtension=false /p:Version=${{ steps.vsixversion.outputs.full }} /v:minimal /bl:vsix.binlog

      - name: Расширение в релиз
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: tools/ZeppelinForms.VisualStudio/bin/**/*.vsix
          fail_on_unmatched_files: true

      # Visual Studio updates an extension by itself only when it was installed from a
      # gallery: the Marketplace. A prerelease is not published — the Marketplace has one
      # version per extension, and everybody would get the preview. While the token is
      # not set up the step says so and passes: the release still has its .vsix.
      # VsixPublisher comes with the VSSDK build tools package the build restored;
      # Visual Studio's own copy is the fallback
      - name: Публикация в Visual Studio Marketplace
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) {
            # a warning annotation rather than a log line: it shows on the run's
            # summary, where a skipped publish is noticed
            Write-Host '::warning title=Marketplace::VS_MARKETPLACE_PAT is not set: the extension is not published to the Marketplace'
            exit 0
          }

          $tool = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.vssdk.buildtools" -Recurse -Filter VsixPublisher.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $tool) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $tool = Get-ChildItem "$vs\VSSDK" -Recurse -Filter VsixPublisher.exe | Select-Object -First 1
          }

          $vsix = Get-ChildItem tools/ZeppelinForms.VisualStudio/bin -Recurse -Filter *.vsix | Select-Object -First 1

          & $tool.FullName publish `
            -payload $vsix.FullName `
            -publishManifest tools/ZeppelinForms.VisualStudio/publishManifest.json `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
          exit $LASTEXITCODE

      - name: Выгрузить журнал сборки расширения
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vsix-binlog
          path: vsix.binlog
          if-no-files-found: ignore

  # The VS Code extension and the Rider plugin, attached to the release as the Visual Studio
  # extension is. The .NET programs inside get the tag's full version; a .vsix version is
  # numbers only, as a Visual Studio one: v0.19.0-preview.1 gives 0.19.0
  editors:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Версия из тега
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "full=$VERSION" >> $GITHUB_OUTPUT
          echo "numbers=${VERSION%%-*}" >> $GITHUB_OUTPUT

      - name: Расширение VS Code
        working-directory: tools/ZeppelinForms.VSCode
        run: |
          npm ci
          npm version ${{ steps.version.outputs.numbers }} --no-git-tag-version --allow-same-version
          node scripts/build.js --version ${{ steps.version.outputs.full }}
          npx vsce package --out zeppelinforms-${{ steps.version.outputs.full }}.vsix

      - name: Плагин Rider
        working-directory: tools/ZeppelinForms.Rider
        run: bash gradlew buildPlugin -PpluginVersion=${{ steps.version.outputs.full }} -PzfVersion=${{ steps.version.outputs.full }}

      - name: Расширение и плагин в релиз
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            tools/ZeppelinForms.VSCode/*.vsix
            tools/ZeppelinForms.Rider/build/distributions/*.zip
          fail_on_unmatched_files: true

      # the marketplaces, as Visual Studio's: not for a prerelease, and while a token is not
      # set up the step says so and passes — the release still has the files
      - name: Публикация в VS Code Marketplace
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: tools/ZeppelinForms.VSCode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::warning title=VS Code Marketplace::VSCE_PAT is not set: the extension is not published'
            exit 0
          fi
          npx vsce publish --packagePath zeppelinforms-${{ steps.version.outputs.full }}.vsix

      - name: Публикация в JetBrains Marketplace
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: tools/ZeppelinForms.Rider
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo '::warning title=JetBrains Marketplace::JETBRAINS_MARKETPLACE_TOKEN is not set: the plugin is not published'
            exit 0
          fi
          bash gradlew publishPlugin -PpluginVersion=${{ steps.version.outputs.full }} -PzfVersion=${{ steps.version.outputs.full }}
