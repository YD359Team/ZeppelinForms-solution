name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Версия из тега
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - run: dotnet test --configuration Release
  
      - name: Извлечь описание версии
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # ссылка на полный список изменений внизу описания
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "[Полный список изменений](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)" >> release-notes.md

          cat release-notes.md

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md