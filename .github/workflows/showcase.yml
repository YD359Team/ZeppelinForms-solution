# Builds the ZeppelinForms showcase for the browser and publishes it here, on GitHub
# Pages: https://yd359team.github.io/
#
# The framework is checked out at a branch or a tag — master by default; a manual run
# asks which. A release of the framework can start this run itself with a repository
# dispatch of the type "zeppelinforms-release", the tag in client_payload.ref.
#
# Pages must publish from GitHub Actions: Settings › Pages › Build and deployment ›
# Source: GitHub Actions.

name: Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: The ZeppelinForms branch or tag to build
        required: true
        default: master
  repository_dispatch:
    types: [zeppelinforms-release]

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer one waits rather than cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZF_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'master' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ZeppelinForms
        uses: actions/checkout@v6
        with:
          repository: YD359Team/ZeppelinForms-solution
          ref: ${{ env.ZF_REF }}
          path: zf

      # the SDK the framework itself asks for
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: zf/global.json

      # Skia is linked into the application's own wasm module (WasmBuildNative):
      # that takes the wasm-tools workload with its Emscripten
      - name: WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Publish the showcase
        run: dotnet publish "zf/examples/ZF Wasm/ZF Wasm.csproj" --configuration Release --output publish

      # the page asks for its font and assets by absolute paths — /fonts/…, /Assets/… —
      # which is why the showcase is the root of the site
      - name: The site
        run: |
          mkdir -p site
          cp -r publish/wwwroot/. site/
          echo "${ZF_REF} $(git -C zf rev-parse --short HEAD)" > site/version.txt

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4