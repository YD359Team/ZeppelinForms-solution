name: Wiki

# docs/wiki is the source of the GitHub wiki: every push to master that changes it
# publishes it, and it can be published by hand. The wiki must exist first — create
# any page once in the GitHub UI (Wiki → Create the first page)

on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write   # the wiki is a repository of its own, written with the same token

# two pushes in a row publish one after the other, not over each other
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Publish docs/wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

          # the wiki becomes exactly the folder: a page deleted here goes there too.
          # The folder's README is for the repository, not a page
          rsync -a --delete --exclude '.git' --exclude 'README.md' docs/wiki/ wiki/

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "The wiki is up to date"
            exit 0
          fi

          git commit -m "Docs from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
