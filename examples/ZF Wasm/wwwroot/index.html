<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>ZeppelinForms</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        /* canvas тянется на всё окно; ResizeObserver в zf.js
           подхватит любое изменение размера сам */
        #zf-canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="zf-canvas"></canvas>
    <script type="module" src="main.js"></script>
</body>
</html>
