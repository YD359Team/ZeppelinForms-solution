<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>ZeppelinForms</title>
    <!-- no icon of its own yet: an empty one, so the browser doesn't ask the server for /favicon.ico -->
    <link rel="icon" href="data:," />
    <!-- filled at publish (OverrideHtmlAssetPlaceholders): maps ./_framework/dotnet.js,
     ./zf.js and the rest to their fingerprinted names, so a new deployment is never
     served from a browser's cache of the old one -->
    <script type="importmap"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }
        /* canvas тянется на всё окно; ResizeObserver в zf.js
           подхватит любое изменение размера сам */
        #zf-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="zf-canvas"></canvas>
    <script type="module" src="main#[.{fingerprint}].js"></script>
</body>
</html>
