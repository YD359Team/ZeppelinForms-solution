<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the page goes under a phone's notch and gesture bar, and the
         form keeps its bars clear of them by env(safe-area-inset-*).
         interactive-widget=resizes-content: the on-screen keyboard makes the page shorter,
         so the focused field is lifted above it -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MyApp</title>
    <link rel="icon" href="data:," />
    <!-- filled at publish: maps ./_framework/dotnet.js, ./zf.js and the rest to their
         fingerprinted names -->
    <script type="importmap"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #zf-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="zf-canvas"></canvas>
    <script type="module" src="main#[.{fingerprint}].js"></script>
</body>
</html>
